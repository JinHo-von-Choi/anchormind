name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  unit:
    name: Unit Tests (no DB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      # 런타임 의존성에 알려진 취약점이 있으면 여기서 막는다. 개발 의존성은
      # 배포물에 실리지 않으므로 분리해 본다.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=moderate
      - name: Audit all dependencies (report only)
        run: npm audit --audit-level=high || true
      - name: All unit tests (Jest + node:test)
        run: npm test
      # 통합시험은 외부 서비스 없이 도는 것을 전제로 작성돼 있다. 실제로 그런지
      # 여기서 확인한다. 외부 의존이 새로 생기면 이 단계가 먼저 깨진다.
      - name: Integration tests (no external services)
        run: npm run test:integration

  runtime-matrix:
    name: Runtime Boot (Node 20/22/24)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      # 단위시험은 --experimental-test-module-mocks에 의존하며 이 기능은 Node 24에서만
      # 안정적이다. 여기서는 런타임이 선언한 지원 범위에서 실제로 뜨는지만 본다.
      - name: Module graph loads
        run: node -e "import('./lib/tools/index.js').then(m => { if (m.getToolsDefinition(null).length < 18) process.exit(1); })"
      - name: Startup gate rejects missing key
        run: |
          set +e
          MEMENTO_ACCESS_KEY="" MEMENTO_AUTH_DISABLED="" node server.js
          code=$?
          set -e
          test "$code" -eq 78

  e2e:
    name: E2E Tests (with DB)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_DB:       memento_test
          POSTGRES_USER:     memento
          POSTGRES_PASSWORD: memento_test
        ports:
          - 35433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      POSTGRES_HOST:      localhost
      POSTGRES_PORT:      35433
      POSTGRES_DB:        memento_test
      POSTGRES_USER:      memento
      POSTGRES_PASSWORD:  memento_test
      DATABASE_URL:       postgresql://memento:memento_test@localhost:35433/memento_test
      REDIS_ENABLED:      "false"
      EMBEDDING_ENABLED:  "false"
      MEMENTO_ACCESS_KEY: ci-test-key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Initialize schema and run migrations
        run: |
          DB_URL="postgresql://memento:memento_test@localhost:35433/memento_test"
          psql "$DB_URL" -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql "$DB_URL" -f lib/memory/memory-schema.sql
          npm run migrate
      - name: E2E tests
        run: npm run test:e2e
